# Local txAdmin server.cfg — do not commit keys
# WTBG V2 standalone. Do not start ESX / QBCore / Qbox / ox_inventory with this stack.

set mysql_connection_string "mysql://root@localhost/wtbattleground?charset=utf8mb4"

endpoint_add_tcp "0.0.0.0:34891"
endpoint_add_udp "0.0.0.0:34891"
sv_maxclients 10

sv_scriptHookAllowed 0
set sv_UseDirectListing false

sets Developer "ZIO"
sets banner_detail "https://share.creavite.co/wnnhvzjjQHSOlGOv.gif"
sets banner_connecting "https://share.creavite.co/wnnhvzjjQHSOlGOv.gif"
sv_hostname "#WHITETIGER BATTLEGROUND"
sets sv_projectName "#WHITETIGER BATTLEGROUND"
sets sv_projectDesc "DEVELOPED BY ZIO & ASYRAF"
sets locale "id-ID"
sets tags "indonesia-battleground-ffa"
sets gametype "ffa - battleground"

set sv_enforceGameBuild 2699

# OneSync: set this in the txAdmin settings page, not here.

# load_server_icon logo.png

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin wtbg.dev allow
add_principal identifier.steam:11000011a1c0771 group.admin
add_principal identifier.steam:1100001150f4a67 group.admin
add_principal identifier.steam:1100001322d9a97 group.admin
add_principal identifier.steam:1100001092889b1 group.admin

set sv_licenseKey "cfxk_1gOVgENLSFELWyrgt3RwR_2DKrQF"
set steam_webApiKey "D1A189B95F5B1DA76DEA787F640E6B24"

