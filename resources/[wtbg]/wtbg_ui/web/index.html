<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <section id="lobby" class="screen hidden">
            <div class="brand">
                <p class="eyebrow">Standalone Prototype</p>
                <h1>WHITE TIGER<br>BATTLEGROUND <span>V2</span></h1>
                <p id="lobby-status" class="status">Status: Lobby</p>
                <p id="lobby-meta" class="meta"></p>
                <p class="hint">F6 menu &nbsp;/&nbsp; /partyinvite &nbsp;/&nbsp; /joinmatch</p>
            </div>
            <aside id="party-panel" class="party-panel">
                <p class="party-title">PARTY</p>
                <p id="party-size" class="party-size">0 / 4</p>
                <ul id="party-slots"></ul>
            </aside>
        </section>

        <section id="menu" class="panel hidden">
            <header>
                <p>Match Controls</p>
                <button id="btn-close" type="button">Close</button>
            </header>
            <button id="btn-create" type="button">Create Match</button>
            <div class="join-row">
                <input id="join-id" type="text" inputmode="numeric" maxlength="8" placeholder="Match ID">
                <button id="btn-join" type="button">Join</button>
            </div>
            <button id="btn-start" type="button">Start Match</button>
            <button id="btn-leave" type="button" class="ghost">Leave Match</button>
        </section>

        <section id="invite" class="panel hidden">
            <p class="invite-kicker">PARTY INVITE</p>
            <p id="invite-text" class="invite-text"></p>
            <div class="invite-actions">
                <button id="btn-accept" type="button">Accept</button>
                <button id="btn-decline" type="button" class="ghost">Decline</button>
            </div>
        </section>

        <section id="hud" class="screen hidden">
            <div class="alive">
                <span>ALIVE</span>
                <strong id="hud-alive">0</strong>
            </div>
            <div class="kills">
                <span>KILLS</span>
                <strong id="hud-kills">0</strong>
            </div>
            <aside id="squad-panel" class="squad-panel hidden">
                <p class="party-title">SQUAD</p>
                <ul id="squad-slots"></ul>
            </aside>
        </section>

        <section id="killfeed"></section>

        <section id="result" class="screen hidden">
            <div class="result-card">
                <p id="result-kicker" class="kicker">MATCH OVER</p>
                <h2 id="result-title">WINNER</h2>
                <p id="result-winner" class="winner-name"></p>
                <div class="stats">
                    <div>
                        <span>Your Kills</span>
                        <strong id="result-kills">0</strong>
                    </div>
                    <div id="result-teamkills-wrap" class="hidden">
                        <span>Team Kills</span>
                        <strong id="result-teamkills">0</strong>
                    </div>
                    <div>
                        <span>Placement</span>
                        <strong id="result-place">-</strong>
                    </div>
                </div>
                <ul id="result-squad" class="result-squad"></ul>
            </div>
        </section>

        <section id="toasts"></section>
    </div>
    <script src="app.js"></script>
</body>
</html>
