<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WTBG Preview — Crew List</title>
  <style>
    :root {
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.55);
      --name-bg: rgba(32, 32, 32, 0.72);
      --armor: #4fd2e8;
      --health: #f2f2f2;
      --track: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 25% 15%, #3a4658 0%, transparent 50%),
        radial-gradient(ellipse at 75% 85%, #2a3340 0%, transparent 45%),
        #1c222b;
    }

    .stage {
      width: min(960px, 94vw);
      padding: 28px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 820px) {
      .stage {
        grid-template-columns: 1fr;
      }
    }

    .label {
      grid-column: 1 / -1;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ===== Crew panel (style referensi) ===== */
    .crew {
      width: 280px;
      user-select: none;
    }

    .crew-title {
      font-family: "Arial Black", "Arial Bold", Arial, sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .crew-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      list-style: none;
    }

    .member {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 0;
      align-items: stretch;
    }

    .member.is-dead {
      opacity: 0.38;
    }

    .member-index {
      display: grid;
      place-items: center;
      font-family: "Arial Black", Arial, sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: #111;
      line-height: 1;
    }

    .member-body {
      min-width: 0;
    }

    .member-name {
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: var(--name-bg);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .member-bars {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 2px;
    }

    .mini-bar {
      position: relative;
      height: 3px;
      background: var(--track);
      overflow: hidden;
    }

    .mini-bar > span {
      display: block;
      height: 100%;
      width: 0%;
      transition: width 140ms linear;
    }

    .mini-bar.armor > span {
      background: var(--armor);
    }

    .mini-bar.health > span {
      background: var(--health);
    }

    /* color slots 1..8 */
    .c1 { background: #e23b3b; }
    .c2 { background: #e6c12e; }
    .c3 { background: #7fd63a; }
    .c4 { background: #8a4fd6; }
    .c5 { background: #e88a2a; }
    .c6 { background: #3b78e0; }
    .c7 { background: #e35aa8; }
    .c8 { background: #efefef; }

    /* ===== Placement mock ===== */
    .placement {
      position: relative;
      min-height: 360px;
      border-radius: 10px;
      border: 1px dashed rgba(255, 255, 255, 0.18);
      background: rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .placement .tag {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .placement .crew {
      position: absolute;
      top: 42px;
      left: 18px;
      width: 240px;
    }

    .placement .crew-title {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .placement .member-index {
      width: 24px;
      font-size: 12px;
    }

    .placement .member {
      grid-template-columns: 24px 1fr;
    }

    .placement .member-name {
      height: 22px;
      font-size: 12px;
      padding: 0 8px;
    }

    .panel {
      grid-column: 1 / -1;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.28);
    }

    .panel h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .actions button,
    .row-actions button {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .actions button:hover,
    .row-actions button:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .editor {
      display: grid;
      gap: 10px;
    }

    .editor-row {
      display: grid;
      grid-template-columns: 28px 1fr 90px 90px auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 820px) {
      .editor-row {
        grid-template-columns: 28px 1fr;
      }
    }

    .editor-row input[type="text"],
    .editor-row input[type="number"] {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
    }

    .editor-row input[type="number"] {
      font-variant-numeric: tabular-nums;
    }

    .slot-dot {
      width: 22px;
      height: 22px;
      border-radius: 3px;
      display: grid;
      place-items: center;
      color: #111;
      font-size: 12px;
      font-weight: 800;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="label">Preview · Crew name + HP / Armor</p>

    <aside>
      <div class="crew" id="crew-demo"></div>
    </aside>

    <section class="placement" aria-label="Posisi in-game">
      <span class="tag">Posisi di game · pojok kiri atas (squad HUD)</span>
      <div class="crew" id="crew-ingame"></div>
    </section>

    <div class="panel">
      <h2>Edit crew (preview)</h2>
      <div class="actions">
        <button type="button" id="btn-damage">Random damage semua</button>
        <button type="button" id="btn-reset">Reset full</button>
        <button type="button" id="btn-kill-first">Kill slot 1</button>
      </div>
      <div class="editor" id="editor"></div>
      <p class="note">
        Preview saja — mirip list crew referensi (index warna + nama + bar armor cyan / health putih).
        Belum masuk ke <code>wtbg_ui</code>. Party max di game sekarang 4; preview pakai sampai 8 biar mirip contoh.
      </p>
    </div>
  </div>

  <script>
    const COLORS = ["c1", "c2", "c3", "c4", "c5", "c6", "c7", "c8"];

    const members = [
      { name: "WT - Cr1lots", armor: 72, health: 100, alive: true },
      { name: "WT Lansky", armor: 100, health: 88, alive: true },
      { name: "wt agus123", armor: 40, health: 100, alive: true },
      { name: "WT.Reza", armor: 100, health: 100, alive: true },
      { name: "Kenzo", armor: 55, health: 70, alive: true },
      { name: "Tiger_06", armor: 0, health: 45, alive: true },
      { name: "NovaFox", armor: 90, health: 100, alive: true },
      { name: "ShadowX", armor: 20, health: 15, alive: true },
    ];

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, Number(n) || 0));
    }

    function renderCrew(targetId) {
      const root = document.getElementById(targetId);
      const rows = members
        .map((m, i) => {
          const dead = !m.alive || m.health <= 0;
          return `
            <li class="member${dead ? " is-dead" : ""}">
              <div class="member-index ${COLORS[i]}">${i + 1}</div>
              <div class="member-body">
                <div class="member-name">${escapeHtml(m.name)}</div>
                <div class="member-bars">
                  <div class="mini-bar armor"><span style="width:${clamp(m.armor, 0, 100)}%"></span></div>
                  <div class="mini-bar health"><span style="width:${clamp(m.health, 0, 100)}%"></span></div>
                </div>
              </div>
            </li>`;
        })
        .join("");

      root.innerHTML = `
        <p class="crew-title">WHITE TIGER</p>
        <ul class="crew-list">${rows}</ul>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderEditor() {
      const editor = document.getElementById("editor");
      editor.innerHTML = members
        .map((m, i) => `
          <div class="editor-row" data-index="${i}">
            <div class="slot-dot ${COLORS[i]}">${i + 1}</div>
            <input type="text" data-field="name" value="${escapeHtml(m.name)}" />
            <input type="number" data-field="armor" min="0" max="100" value="${m.armor}" title="Armor" />
            <input type="number" data-field="health" min="0" max="100" value="${m.health}" title="Health" />
            <div class="row-actions">
              <button type="button" data-action="toggle">${m.alive && m.health > 0 ? "Kill" : "Revive"}</button>
            </div>
          </div>
        `)
        .join("");
    }

    function renderAll() {
      renderCrew("crew-demo");
      renderCrew("crew-ingame");
      renderEditor();
    }

    document.getElementById("editor").addEventListener("input", (event) => {
      const input = event.target;
      if (!(input instanceof HTMLInputElement)) return;
      const row = input.closest(".editor-row");
      if (!row) return;
      const index = Number(row.dataset.index);
      const field = input.dataset.field;
      if (field === "name") {
        members[index].name = input.value;
      } else if (field === "armor") {
        members[index].armor = clamp(input.value, 0, 100);
      } else if (field === "health") {
        members[index].health = clamp(input.value, 0, 100);
        if (members[index].health <= 0) members[index].alive = false;
        if (members[index].health > 0) members[index].alive = true;
      }
      renderCrew("crew-demo");
      renderCrew("crew-ingame");
    });

    document.getElementById("editor").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action='toggle']");
      if (!btn) return;
      const row = btn.closest(".editor-row");
      const index = Number(row.dataset.index);
      const m = members[index];
      if (m.alive && m.health > 0) {
        m.alive = false;
        m.health = 0;
      } else {
        m.alive = true;
        m.health = Math.max(m.health, 35);
      }
      renderAll();
    });

    document.getElementById("btn-damage").addEventListener("click", () => {
      members.forEach((m) => {
        if (!m.alive) return;
        const dmg = 8 + Math.floor(Math.random() * 28);
        let left = dmg;
        if (m.armor > 0) {
          const taken = Math.min(m.armor, left);
          m.armor -= taken;
          left -= taken;
        }
        if (left > 0) m.health = clamp(m.health - left, 0, 100);
        if (m.health <= 0) m.alive = false;
      });
      renderAll();
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      members.forEach((m) => {
        m.armor = 100;
        m.health = 100;
        m.alive = true;
      });
      renderAll();
    });

    document.getElementById("btn-kill-first").addEventListener("click", () => {
      members[0].health = 0;
      members[0].alive = false;
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
